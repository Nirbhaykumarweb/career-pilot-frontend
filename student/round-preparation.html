<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Pilot | Round Preparation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
</head>

<body class="student-shell">
    <div class="container-fluid p-0">
        <div class="row g-0">
            <aside class="col-lg-2 student-sidebar p-3">
                <div class="d-flex align-items-center mb-4">
                    <span class="brand-badge"><img src="..\carreer_pilot_logo.png" alt="Career Pilot logo" /></span>
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge me-2"></i>Dashboard</a>
                    <a class="nav-link" href="companies.html"><i class="fa-solid fa-building me-2"></i>Companies</a>
                    <a class="nav-link active" href="questions.html"><i class="fa-solid fa-question-circle me-2"></i>Questions</a>
                    <a class="nav-link" href="interview-preparation.html"><i class="fa-solid fa-book-open me-2"></i>Preparation</a>
                    <a class="nav-link" href="projects.html"><i class="fa-solid fa-diagram-project me-2"></i>Projects</a>
                    <a class="nav-link" href="ai-interview.html?source=student"><i class="fa-solid fa-robot me-2"></i>AI Interview</a>
                    <a class="nav-link" href="settings.html"><i class="fa-solid fa-gear me-2"></i>Settings</a>
                </nav>
            </aside>

            <main class="col-lg-10 content-panel">
                <div id="roundPreparationContent"></div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/career-pilot-store.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const root = document.getElementById('roundPreparationContent');
            const store = window.careerPilotStore;
            if (!root || !store) return;

            const params = new URLSearchParams(window.location.search);
            const companyId = params.get('company');
            const requestedRound = params.get('round') || 'aptitude';
            const company = companyId ? store.getCompanyById(companyId) : null;

            if (!company) {
                root.innerHTML = `
                    <div class="page-header">
                        <h2 class="mb-1">Company not found</h2>
                        <p class="mb-0 text-white-50">The selected company does not exist.</p>
                    </div>
                    <div class="alert alert-warning mt-4">No company data was found for this round. <a href="companies.html" class="btn btn-primary ms-2">Back to companies</a></div>
                `;
                return;
            }

            const rounds = company.rounds || [];
            const activeIndex = rounds.findIndex((round) => {
                const candidate = (round.id || round.name || round.type || '').toLowerCase();
                return candidate === requestedRound.toLowerCase() || (round.name || round.type || '').toLowerCase() === requestedRound.toLowerCase();
            });
            const selectedRound = rounds[activeIndex >= 0 ? activeIndex : 0] || { id: 'general', name: 'General', type: 'General' };
            const questions = store.getQuestions().filter((q) => {
                if (q.general) return true;
                const sameCompany = q.companyId === company.id || q.companyName === company.name;
                return sameCompany && (!requestedRound || String(q.round).toLowerCase() === String(selectedRound.id || selectedRound.name || selectedRound.type || '').toLowerCase() || String(q.round).toLowerCase() === String(selectedRound.name || selectedRound.type || '').toLowerCase());
            });

            function buildLink(roundIndex) {
                const round = rounds[roundIndex];
                if (!round) return 'company-details.html?company=' + encodeURIComponent(company.id);
                const roundId = round.id || slugify(round.name || round.type || 'custom');
                return 'round-preparation.html?company=' + encodeURIComponent(company.id) + '&round=' + encodeURIComponent(roundId);
            }

            function slugify(value) {
                return String(value || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'round';
            }

            const prevRound = activeIndex > 0 ? buildLink(activeIndex - 1) : null;
            const nextRound = activeIndex < rounds.length - 1 ? buildLink(activeIndex + 1) : null;
            const questionCards = questions.length ? questions.map((q, index) => `
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="chip">${q.topic || 'General'}</span>
                            <span class="text-muted-soft">${q.difficulty || 'Medium'}</span>
                        </div>
                        <h5>${index + 1}. ${q.question}</h5>
                        <p class="text-muted-soft mb-2">Answer / Explanation: ${q.answer || 'No explanation recorded yet.'}</p>
                    </div>
                </div>
            `).join('') : '<div class="alert alert-info">No questions are available for this selected company round yet.</div>';

            root.innerHTML = `
                <div class="page-header">
                    <h2 class="mb-1">${company.name}</h2>
                    <p class="mb-0 text-white-50">Round: ${selectedRound.name || selectedRound.type || 'General'}</p>
                </div>
                <div class="timeline-card mb-4">
                    <div class="d-flex flex-wrap gap-2">
                        ${prevRound ? '<a href="' + prevRound + '" class="btn btn-outline-primary btn-sm">Previous Round</a>' : '<span class="btn btn-outline-secondary btn-sm disabled">Previous Round</span>'}
                        ${nextRound ? '<a href="' + nextRound + '" class="btn btn-primary btn-sm">Next Round</a>' : '<span class="btn btn-secondary btn-sm disabled">Last Round</span>'}
                    </div>
                </div>
                <div class="timeline-card">
                    <h4>Questions for ${selectedRound.name || selectedRound.type || 'General'}</h4>
                    ${questionCards}
                </div>
            `;
        });
    </script>
</body>

</html>
