<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Pilot | Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
</head>

<body class="student-shell">
    <div class="container-fluid p-0">
        <div class="row g-0">
            <aside class="col-lg-2 student-sidebar p-3">
                <div class="d-flex align-items-center mb-4">
                    <span class="brand-badge"><img
                            src="..\carreer_pilot_logo.png"
                            alt="Career Pilot logo" /></span>
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge me-2"></i>Dashboard</a>
                    <a class="nav-link" href="companies.html"><i class="fa-solid fa-building me-2"></i>Companies</a>
                    <a class="nav-link" href="interview-preparation.html"><i
                            class="fa-solid fa-book-open me-2"></i>Preparation</a>
                    <a class="nav-link" href="questions.html"><i
                            class="fa-solid fa-question-circle me-2"></i>Questions</a>
                    <a class="nav-link" href="dsa.html"><i class="fa-solid fa-code me-2"></i>DSA</a>
                    <a class="nav-link" href="aptitude.html"><i class="fa-solid fa-brain me-2"></i>Aptitude</a>
                    <a class="nav-link" href="projects.html"><i
                            class="fa-solid fa-diagram-project me-2"></i>Projects</a>
                    <a class="nav-link" href="ai-interview.html?source=student"><i class="fa-solid fa-robot me-2"></i>AI Interview</a>
                    <a class="nav-link" href="interview-experience.html"><i
                            class="fa-solid fa-comments me-2"></i>Experiences</a>
                    <a class="nav-link" href="progress.html"><i class="fa-solid fa-chart-line me-2"></i>Progress</a>
                    <a class="nav-link" href="saved.html"><i class="fa-solid fa-bookmark me-2"></i>Saved</a>
                    <a class="nav-link active" href="profile.html"><i class="fa-solid fa-user me-2"></i>Profile</a>
                    <a class="nav-link" href="settings.html"><i class="fa-solid fa-gear me-2"></i>Settings</a>
                    <a class="nav-link" href="../index.html"><i
                            class="fa-solid fa-right-from-bracket me-2"></i>Logout</a>
                </nav>
            </aside>

            <main class="col-lg-10 content-panel">
                <div class="page-header">
                    <h2 class="mb-1">Profile</h2>
                    <p class="mb-0 text-white-50">Manage your personal details and placement preparation profile.</p>
                </div>

                <div class="row g-4">
                    <div class="col-lg-4">
                        <div class="timeline-card h-100 text-center">
                            <div class="company-logo mx-auto mb-3" style="width:90px;height:90px;font-size:2rem;">S
                            </div>
                            <h4>Student</h4>
                            <p class="text-muted-soft">Engineering Student</p>
                            <button class="btn btn-outline-primary">Edit Profile</button>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="timeline-card h-100">
                            <h4>Profile Information</h4>
                            <div class="row g-3 mt-2">
                                <div class="col-md-6">
                                    <label class="form-label">Name</label>
                                    <input type="text" class="form-control" value="Student">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" value="student@careerpilot.com">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">College</label>
                                    <input type="text" class="form-control" value="ABC College of Engineering">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Branch</label>
                                    <input type="text" class="form-control" value="CSE">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Semester</label>
                                    <input type="text" class="form-control" value="6th">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Skills</label>
                                    <input type="text" class="form-control" value="Java, DSA, SQL, HTML, CSS">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Resume</label>
                                    <input type="text" class="form-control" value="resume.pdf">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Target Companies</label>
                                    <input type="text" class="form-control" value="TCS, Infosys, Wipro">
                                </div>
                            </div>
                            <button class="btn btn-primary mt-4">Save Changes</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
