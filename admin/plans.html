<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Pilot | Admin Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/admin.css" />
</head>

<body>
    <div class="admin-shell container-fluid p-0">
        <div class="row g-0">
            <aside class="col-lg-2 admin-sidebar p-3">
                <div class="d-flex align-items-center mb-4">
                    <span class="brand-badge"><img
                            src="..\carreer_pilot_logo.png"
                            alt="Career Pilot logo" /></span>
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="admin.html"><i class="fa-solid fa-gauge me-2"></i>Dashboard</a>
                    <a class="nav-link" href="companies.html"><i class="fa-solid fa-building me-2"></i>Companies</a>
                    <a class="nav-link" href="questions.html"><i
                            class="fa-solid fa-question-circle me-2"></i>Questions</a>
                    <a class="nav-link" href="experiences.html"><i class="fa-solid fa-comments me-2"></i>Interview
                        Experiences</a>
                    <a class="nav-link" href="users.html"><i class="fa-solid fa-users me-2"></i>Users</a>
                    <a class="nav-link" href="interviews.html"><i class="fa-solid fa-robot me-2"></i>AI Interviews</a>
                    <a class="nav-link active" href="plans.html"><i class="fa-solid fa-crown me-2"></i>Premium Plans</a>
                    <a class="nav-link" href="settings.html"><i class="fa-solid fa-gear me-2"></i>Settings</a>
                    <a class="nav-link" href="../index.html"><i
                            class="fa-solid fa-right-from-bracket me-2"></i>Logout</a>
                </nav>
            </aside>

            <main class="col-lg-10 admin-content">
                <div class="admin-topbar px-4 py-3 d-flex justify-content-between align-items-center rounded-3 mb-4">
                    <div>
                        <h4 class="mb-0">Premium Plans</h4>
                    </div>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#planModal">+ Add Plan</button>
                </div>

                <div id="plansContainer" class="row g-4"></div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="planModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="planModalTitle">Add Plan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="planForm">
                        <input type="hidden" id="planId" />
                        <div class="mb-3">
                            <label class="form-label" for="planName">Plan Name</label>
                            <input type="text" class="form-control" id="planName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="planPrice">Price</label>
                            <input type="text" class="form-control" id="planPrice" placeholder="?999" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="planFeatures">Features (one per line)</label>
                            <textarea class="form-control" id="planFeatures" rows="4" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="planStatus">Status</label>
                            <select class="form-select" id="planStatus">
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button class="btn btn-primary" type="submit" form="planForm">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/career-pilot-store.js"></script>
    <script src="assets/js/admin.js"></script>
</body>

</html>
